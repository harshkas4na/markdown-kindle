<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
<rect width="800" height="320" fill="#f7f5ef"/>
<text x="400" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#222">external data to ingest to context and signals to flows and actions</text>
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="20" y="70" width="120" height="90" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="80" y="100" font-weight="700">Their systems</text><text x="80" y="120">Salesforce, HubSpot</text><text x="80" y="138">Zendesk, Zoom, Slack</text>
<rect x="170" y="70" width="120" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="230" y="100" font-weight="700">Ingest</text><text x="230" y="120">models and</text><text x="230" y="138">connections</text>
<rect x="320" y="70" width="120" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="380" y="100" font-weight="700">Refresh</text><text x="380" y="120">query reruns,</text><text x="380" y="138">rows rewritten</text>
<rect x="470" y="70" width="120" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="530" y="100" font-weight="700">Labels</text><text x="530" y="120">topics, tone,</text><text x="530" y="138">impact</text>
<rect x="620" y="70" width="160" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="700" y="100" font-weight="700">Signals</text><text x="700" y="120">scores, needle movers,</text><text x="700" y="138">dossier</text>
<rect x="300" y="210" width="200" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="400" y="238" font-weight="700">Flows and actions</text><text x="400" y="258">email, Slack, tasks, CRM, decks</text>
</g>
<g stroke="#555" stroke-width="3" fill="none"><path d="M142 115 L168 115"/><path d="M292 115 L318 115"/><path d="M442 115 L468 115"/><path d="M592 115 L618 115"/><path d="M700 162 L700 195 L502 245"/></g>
<g fill="#dc2626" font-size="12" text-anchor="middle">
<circle cx="230" cy="62" r="9"/><text x="230" y="66" fill="#fff" font-weight="700">1</text>
<circle cx="380" cy="62" r="9"/><text x="380" y="66" fill="#fff" font-weight="700">2</text>
<circle cx="530" cy="62" r="9"/><text x="530" y="66" fill="#fff" font-weight="700">3</text>
</g>
<g font-size="12" fill="#b91c1c">
<text x="20" y="190">1 wrong source or id (two Salesforce orgs)</text>
<text x="20" y="208">2 feed dies, query breaks, no error</text>
<text x="20" y="226">3 labelled on the raw reply chain</text>
</g>
<text x="400" y="306" text-anchor="middle" font-size="12" fill="#555">Red numbers mark where data most often dies without an error.</text>
</svg>
