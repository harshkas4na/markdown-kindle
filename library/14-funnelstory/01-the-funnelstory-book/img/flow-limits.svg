<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Helvetica, Arial, sans-serif">
<rect width="800" height="330" fill="#f7f5ef"/>
<text x="400" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#222">Locals are not counted. Globals are.</text>
<g font-size="13" fill="#222" text-anchor="middle">
<rect x="20" y="60" width="200" height="100" rx="10" fill="#fff" stroke="#6b7280" stroke-width="2"/><text x="120" y="90" font-weight="700">Step 1: CALL</text><text x="120" y="112">fetch from ClickUp</text><text x="120" y="134" font-size="12" fill="#b91c1c">out: set "x" (local)</text><text x="120" y="150" font-size="12" fill="#b91c1c">45 KB per task</text>
<rect x="300" y="60" width="200" height="100" rx="10" fill="#fff" stroke="#6b7280" stroke-width="2"/><text x="400" y="90" font-weight="700">Step 2: script.js</text><text x="400" y="112">keep the six fields used</text><text x="400" y="134" font-size="12" fill="#166534">out: set "@.x" (global)</text><text x="400" y="150" font-size="12" fill="#166534">about 200 bytes</text>
<rect x="580" y="60" width="200" height="100" rx="10" fill="#fff" stroke="#6b7280" stroke-width="2"/><text x="680" y="90" font-weight="700">Later steps</text><text x="680" y="112">use the trimmed global</text><text x="680" y="134" font-size="12" fill="#166534">counts against</text><text x="680" y="150" font-size="12" fill="#166534">MaxVariablesSize</text>
</g>
<g stroke="#555" stroke-width="3" fill="none"><path d="M222 110 L298 110"/><path d="M502 110 L578 110"/></g>
<rect x="20" y="195" width="760" height="110" rx="10" fill="#e5e7eb" stroke="#6b7280"/>
<g font-size="13" fill="#222"><text x="40" y="222" font-weight="700">The limits (runtime state)</text>
<text x="40" y="245">MaxFunctionOutputSize 10 MiB: one CALL's JSON return</text>
<text x="40" y="265">MaxVariablesSize 10 MiB: the @. globals only</text>
<text x="40" y="285">MaxStepMemorySize 10 MiB: agent history. MaxLoopIterations 10,000. MaxEvents 200</text></g>
</svg>
