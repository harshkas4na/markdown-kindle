<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 470' width='1180' height='470' font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x='0' y='0' width='1180' height='470' rx='18' fill='#fffdf8'/>
<text x='28' y='44' font-size='24' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>What happens to one Private request</text>
<text x='28' y='72' font-size='15' fill='#6f665c' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>Five hops. Your words are readable only inside the two enclaves (green). The router in the middle carries a sealed envelope.</text>
<text x='128' y='118' font-size='13' fill='#3f7bd6' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>ciphertext · TLS</text>
<rect x='28' y='130' width='200' height='128' rx='12' fill='#e5eefb' stroke='#3f7bd6' stroke-width='2'/>
<text x='128.0' y='158' font-size='17' fill='#2b2620' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>Your browser</text>
<text x='128.0' y='180' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>HTTPS that ends</text>
<text x='128.0' y='199' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>inside the gateway</text>
<defs><marker id='m10383' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b2620'/></marker></defs>
<line x1='228' y1='194' x2='260' y2='194' stroke='#2b2620' stroke-width='2.2' marker-end='url(#m10383)'/>
<text x='360' y='118' font-size='13' fill='#2e8b57' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>plaintext · in memory</text>
<rect x='260' y='130' width='200' height='128' rx='12' fill='#e3f2e9' stroke='#2e8b57' stroke-width='2'/>
<text x='360.0' y='158' font-size='17' fill='#2b2620' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>Gateway TEE</text>
<text x='360.0' y='180' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>seals the request to</text>
<text x='360.0' y='199' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>the provider&#x27;s key</text>
<defs><marker id='m69414' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b2620'/></marker></defs>
<line x1='460' y1='194' x2='492' y2='194' stroke='#2b2620' stroke-width='2.2' marker-end='url(#m69414)'/>
<text x='592' y='118' font-size='13' fill='#b3762f' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>ciphertext · HPKE</text>
<rect x='492' y='130' width='200' height='128' rx='12' fill='#f6ead9' stroke='#b3762f' stroke-width='2'/>
<text x='592.0' y='158' font-size='17' fill='#2b2620' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>0G router</text>
<text x='592.0' y='180' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>forwards the envelope</text>
<text x='592.0' y='199' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>never holds the key</text>
<defs><marker id='m53203' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b2620'/></marker></defs>
<line x1='692' y1='194' x2='724' y2='194' stroke='#2b2620' stroke-width='2.2' marker-end='url(#m53203)'/>
<text x='824' y='118' font-size='13' fill='#2e8b57' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>plaintext · in memory</text>
<rect x='724' y='130' width='200' height='128' rx='12' fill='#e3f2e9' stroke='#2e8b57' stroke-width='2'/>
<text x='824.0' y='158' font-size='17' fill='#2b2620' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>Provider TEE</text>
<text x='824.0' y='180' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>the model runs here</text>
<text x='824.0' y='199' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>and decrypts here</text>
<defs><marker id='m88304' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b2620'/></marker></defs>
<line x1='924' y1='194' x2='956' y2='194' stroke='#2b2620' stroke-width='2.2' marker-end='url(#m88304)'/>
<text x='1056' y='118' font-size='13' fill='#3f7bd6' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>ciphertext · signed</text>
<rect x='956' y='130' width='200' height='128' rx='12' fill='#e5eefb' stroke='#3f7bd6' stroke-width='2'/>
<text x='1056.0' y='158' font-size='17' fill='#2b2620' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>Response</text>
<text x='1056.0' y='180' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>sealed back, with an</text>
<text x='1056.0' y='199' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>enclave signature</text>
<rect x='28' y='290' width='560' height='150' rx='12' fill='#f6ead9' stroke='#b3762f' stroke-width='2'/>
<text x='44' y='318' font-size='17' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>The router can still see</text>
<text x='44' y='340' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>which model you asked for</text>
<text x='44' y='361' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>how many tokens you used</text>
<text x='44' y='382' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>message sizes, and timing</text>
<rect x='612' y='290' width='540' height='150' rx='12' fill='#f8e3e0' stroke='#c4473a' stroke-width='2'/>
<text x='628' y='318' font-size='17' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>What this does not prove</text>
<text x='628' y='340' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>the model&#x27;s answer is good or honest</text>
<text x='628' y='361' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>that the service stays online</text>
<text x='628' y='382' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>it is verifiable relay, not verifiable</text>
<text x='628' y='403' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>computation (0G&#x27;s own words)</text>
</svg>
