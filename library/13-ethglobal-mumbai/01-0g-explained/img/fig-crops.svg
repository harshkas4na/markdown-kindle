<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1180 520' width='1180' height='520' font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x='0' y='0' width='1180' height='520' rx='18' fill='#fffdf8'/>
<text x='28' y='44' font-size='24' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>CROPS, letter by letter, for the tutor</text>
<text x='28' y='72' font-size='15' fill='#6f665c' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>Ethereum Foundation&#x27;s test: each property must be structural, or its trade-off stated in the README.</text>
<rect x='28' y='100' width='1124' height='80' rx='12' fill='#f6ead9' stroke='#b3762f' stroke-width='2'/>
<text x='44' y='128' font-size='17' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>C  censorship resistant</text>
<text x='44' y='150' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>the 0G router could refuse us: the tutor freezes and says so; no hidden fallback</text>
<rect x='28' y='196' width='1124' height='80' rx='12' fill='#e5eefb' stroke='#3f7bd6' stroke-width='2'/>
<text x='44' y='224' font-size='17' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>O  open source</text>
<text x='44' y='246' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>MIT repo; anyone can run it with their own 0G key</text>
<rect x='28' y='292' width='1124' height='80' rx='12' fill='#e3f2e9' stroke='#2e8b57' stroke-width='2'/>
<text x='44' y='320' font-size='17' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>P  private (our lead)</text>
<text x='44' y='342' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>pixels stay on the laptop; the outline goes E2EE to a TEE; voice transcribed locally; laya sees ids only</text>
<rect x='28' y='388' width='1124' height='80' rx='12' fill='#efe5fb' stroke='#8a4fd3' stroke-width='2'/>
<text x='44' y='416' font-size='17' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>S  secure</text>
<text x='44' y='438' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>memory encrypted on the laptop before upload; the key never leaves</text>
</svg>
