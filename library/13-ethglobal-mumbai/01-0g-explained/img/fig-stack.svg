<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1100 610' width='1100' height='610' font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect x='0' y='0' width='1100' height='610' rx='18' fill='#fffdf8'/>
<text x='28' y='44' font-size='24' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>0G in one picture</text>
<text x='28' y='72' font-size='15' fill='#6f665c' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>Four layers. Compute sits behind one router API key; the other three you reach with SDKs and RPC.</text>
<rect x='40' y='96' width='1020' height='66' rx='12' fill='#e5eefb' stroke='#3f7bd6' stroke-width='2'/>
<text x='550.0' y='124' font-size='17' fill='#2b2620' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>Your app</text>
<text x='550.0' y='146' font-size='15' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>a browser extension, a desktop app, an agent, a robot</text>
<defs><marker id='m65872' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b2620'/></marker></defs>
<line x1='160' y1='162' x2='160' y2='196' stroke='#2b2620' stroke-width='2.2' marker-end='url(#m65872)'/>
<defs><marker id='m24684' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b2620'/></marker></defs>
<line x1='420' y1='162' x2='420' y2='286' stroke='#2b2620' stroke-width='2.2' marker-end='url(#m24684)'/>
<defs><marker id='m44546' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b2620'/></marker></defs>
<line x1='680' y1='162' x2='680' y2='286' stroke='#2b2620' stroke-width='2.2' marker-end='url(#m44546)'/>
<defs><marker id='m16916' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b2620'/></marker></defs>
<line x1='940' y1='162' x2='940' y2='286' stroke='#2b2620' stroke-width='2.2' marker-end='url(#m16916)'/>
<rect x='40' y='200' width='240' height='82' rx='12' fill='#f6ead9' stroke='#b3762f' stroke-width='2'/>
<text x='160.0' y='228' font-size='17' fill='#2b2620' font-weight='700' text-anchor='middle' xml:space='preserve' style='white-space:pre'>Router API key</text>
<text x='160.0' y='250' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>router-api.0g.ai/v1</text>
<text x='160.0' y='269' font-size='14' fill='#2b2620' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>OpenAI-compatible</text>
<text x='680' y='232' font-size='14' fill='#6f665c' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>SDKs and RPC: storage SDK (TS / Go), ethers / viem, Agentic ID contracts</text>
<defs><marker id='m92780' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2b2620'/></marker></defs>
<line x1='160' y1='282' x2='160' y2='296' stroke='#2b2620' stroke-width='2.2' marker-end='url(#m92780)'/>
<rect x='40' y='300' width='240' height='172' rx='12' fill='#e3f2e9' stroke='#2e8b57' stroke-width='2'/>
<text x='56' y='328' font-size='19' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>Compute</text>
<text x='56' y='353' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>132 models, 19 providers</text>
<text x='56' y='374' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>some inside a TEE (a</text>
<text x='56' y='395' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>sealed CPU enclave) that</text>
<text x='56' y='416' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>signs every answer</text>
<rect x='300' y='300' width='240' height='172' rx='12' fill='#efe5fb' stroke='#8a4fd3' stroke-width='2'/>
<text x='316' y='328' font-size='19' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>Storage</text>
<text x='316' y='353' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>Log layer: append-only</text>
<text x='316' y='374' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>files, each addressed by</text>
<text x='316' y='395' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>a Merkle root hash</text>
<text x='316' y='416' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>KV layer: live state</text>
<rect x='560' y='300' width='240' height='172' rx='12' fill='#f6ead9' stroke='#b3762f' stroke-width='2'/>
<text x='576' y='328' font-size='19' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>Chain</text>
<text x='576' y='353' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>EVM L1 on CometBFT</text>
<text x='576' y='374' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>Solidity, Hardhat, Foundry</text>
<text x='576' y='395' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>Galileo = testnet</text>
<text x='576' y='416' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>settles runs and payments</text>
<rect x='820' y='300' width='240' height='172' rx='12' fill='#e5eefb' stroke='#3f7bd6' stroke-width='2'/>
<text x='836' y='328' font-size='19' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>Agentic ID</text>
<text x='836' y='353' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>ERC-7857 token for</text>
<text x='836' y='374' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>an AI agent: encrypted</text>
<text x='836' y='395' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>model data, re-encrypted</text>
<text x='836' y='416' font-size='15' fill='#2b2620' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>on transfer</text>
<rect x='40' y='500' width='1020' height='74' rx='12' fill='#efebe5' stroke='#6f665c' stroke-width='2' stroke-dasharray='7 5'/>
<text x='550' y='530' font-size='15' fill='#2b2620' font-weight='600' text-anchor='middle' xml:space='preserve' style='white-space:pre'>What our project touches: Compute (ears, eyes, brain, checkpoint)  +  Storage (episode log, memory)</text>
<text x='550' y='556' font-size='15' fill='#6f665c' font-weight='400' text-anchor='middle' xml:space='preserve' style='white-space:pre'>+  optionally Chain (a tiny contract that records each session&#x27;s root hash)</text>
</svg>
