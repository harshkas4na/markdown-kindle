<text x='28' y='44' font-size='24' fill='#2b2620' font-weight='700' text-anchor='start' xml:space='preserve' style='white-space:pre'>The tutor: spinal cord on the laptop, brain sealed on 0G</text>
<text x='28' y='72' font-size='15' fill='#6f665c' font-weight='400' text-anchor='start' xml:space='preserve' style='white-space:pre'>Everything that moves or makes sound stays local. Everything that decides runs sealed and is signed.</text>
